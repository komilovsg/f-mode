<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="t d">
  <title id="t">F-mode: filter-first mode</title>
  <desc id="d">Raw data enters a funnel as many gray lines and leaves as one short result, 39/40 passed with exit=1. Tagline: raw data never enters the context, only the result does.</desc>
  <rect x="1" y="1" width="1198" height="398" rx="24" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <g id="title-block" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="64" y="86" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" fill="#e3b341">$ f-mode  # filter-first</text>
    <text x="60" y="196" font-size="112" font-weight="800" fill="#e6edf3" letter-spacing="-3">F-mode</text>
    <text x="64" y="262" font-size="34" font-weight="600" fill="#e6edf3">Raw data never enters the context</text>
    <text x="64" y="308" font-size="34" font-weight="600" fill="#3fb950">only the result does.</text>
    <text x="64" y="360" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#8b949e">exit code kept · failures grepped · n/total</text>
  </g>
  <g id="funnel">
    <rect x="740" y="54" width="356" height="6" rx="3" fill="#8b949e" opacity="0.55"/><rect x="740" y="68" width="372" height="6" rx="3" fill="#8b949e" opacity="0.35"/><rect x="740" y="82" width="320" height="6" rx="3" fill="#8b949e" opacity="0.35"/><rect x="740" y="96" width="396" height="6" rx="3" fill="#8b949e" opacity="0.55"/><rect x="740" y="110" width="340" height="6" rx="3" fill="#8b949e" opacity="0.35"/><rect x="740" y="124" width="280" height="6" rx="3" fill="#8b949e" opacity="0.35"/><rect x="740" y="138" width="340" height="6" rx="3" fill="#8b949e" opacity="0.55"/><rect x="740" y="152" width="356" height="6" rx="3" fill="#8b949e" opacity="0.35"/><rect x="740" y="166" width="396" height="6" rx="3" fill="#8b949e" opacity="0.35"/>
    <path d="M740 190 H1136 L1020 286 H856 Z" fill="#161b22" stroke="#e3b341" stroke-width="3" stroke-linejoin="round"/>
    <text x="938" y="246" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" font-weight="700" fill="#e3b341">filter</text>
    <path d="M938 286 V304" stroke="#e3b341" stroke-width="3"/>
    <rect x="818" y="304" width="240" height="52" rx="10" fill="#0d1117" stroke="#3fb950" stroke-width="3"/>
    <text x="938" y="339" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="26" font-weight="700" fill="#3fb950">39/40 exit=1</text>
  </g>
</svg>
