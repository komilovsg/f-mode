<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="t d">
  <title id="t">Same failing test run, two ways to read it</title>
  <desc id="d">Example run of 40 pytest tests with one broken. Piping into tail prints one line and exit=0, which looks green. The f-mode pattern prints exit=1, a failure count of 1 and the failing test, in 4 lines and about 26 tokens instead of 65 lines and about 1,112 tokens for pytest -v.</desc>
  <rect x="1" y="1" width="1198" height="798" rx="24" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <text x="48" y="58" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" fill="#8b949e">EXAMPLE RUN · 40 pytest tests, 1 broken</text>
  <g id="trap" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22">
    <rect x="48" y="82" width="1104" height="226" rx="14" fill="#010409" stroke="#30363d" stroke-width="2"/>
    <text x="84" y="124" font-size="20" font-weight="700" fill="#ff7b72" letter-spacing="2">THE TRAP</text>
    <text x="1116" y="124" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#ff7b72">looks green. It was not.</text>
    <text x="84" y="170" fill="#8b949e" >$ pytest -q --tb=short | tail -1</text>
    <text x="84" y="206" fill="#e6edf3" >1 failed, 39 passed in 0.01s</text>
    <text x="84" y="252" fill="#8b949e" >$ echo "exit=$?"</text>
    <text x="84" y="288" fill="#ff7b72" font-weight="700">exit=0</text>
  </g>
  <g id="fmode" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22">
    <rect x="48" y="332" width="1104" height="300" rx="14" fill="#010409" stroke="#3fb950" stroke-width="2"/>
    <text x="84" y="374" font-size="20" font-weight="700" fill="#3fb950" letter-spacing="2">F-MODE</text>
    <text x="1116" y="374" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#3fb950">failure cannot hide</text>
    <text x="84" y="420" fill="#8b949e" >$ pytest -q --tb=short &gt; out.txt 2&gt;&amp;1; echo "exit=$?"</text>
    <text x="84" y="456" fill="#ff7b72" font-weight="700">exit=1</text>
    <text x="84" y="502" fill="#8b949e" >$ grep -cE 'FAILED|ERROR' out.txt; tail -n 2 out.txt</text>
    <text x="84" y="538" fill="#ff7b72" font-weight="700">1</text>
    <text x="84" y="574" fill="#e6edf3" >FAILED test_shop.py::test_order_total[27] - assert 120.0 == 121.0</text>
    <text x="84" y="610" fill="#e6edf3" >1 failed, 39 passed in 0.01s</text>
  </g>
  <g id="size" font-size="20">
    <text x="48" y="682" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#8b949e">What enters the context (chars ÷ 4 ≈ tokens)</text>
    <text x="48" y="728" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#e6edf3">pytest -v</text>
    <rect x="200" y="708" width="560" height="26" rx="6" fill="#ff7b72" opacity="0.85"/>
    <text x="780" y="728" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#e6edf3">65 lines · ~1,112 tokens</text>
    <text x="48" y="774" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#e6edf3">f-mode</text>
    <rect x="200" y="754" width="14" height="26" rx="4" fill="#3fb950"/>
    <text x="234" y="774" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#3fb950" font-weight="700">4 lines · ~26 tokens</text>
  </g>
</svg>
